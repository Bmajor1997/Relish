name: Assurance
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.paths.outputs.mobile }}
      web: ${{ steps.paths.outputs.web }}
      motion: ${{ steps.paths.outputs.motion }}
      native_platform: ${{ steps.paths.outputs.native_platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            printf 'mobile=true\nweb=true\nmotion=true\nnative_platform=both\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only --no-renames -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths-zero"; then
            echo 'Could not determine changed paths; running every suite.'
            printf 'mobile=true\nweb=true\nmotion=true\nnative_platform=both\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m unittest code_checks.native_build_scope_test
          platform=$(python3 scripts/native_build_scope.py < "$RUNNER_TEMP/changed-paths-zero")
          echo "native_platform=$platform" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < "$RUNNER_TEMP/changed-paths-zero" > "$RUNNER_TEMP/changed-paths"
          for scope in mobile web motion; do
            case "$scope" in
              mobile) pattern='^(apps/mobile/|security/|code_checks/|package|\.github/)' ;;
              web) pattern='^(admin/|app_parts/|browser_checks/|votic_|browser_check_settings|package|security/|code_checks/|[^/]+\.(css|html)|\.github/)' ;;
              motion) pattern='^(apps/motion-studio/|apps/mobile/src/motion/|\.github/)' ;;
            esac
            if grep -Eq "$pattern" "$RUNNER_TEMP/changed-paths"; then
              echo "$scope=true" >> "$GITHUB_OUTPUT"
            else
              echo "$scope=false" >> "$GITHUB_OUTPUT"
            fi
          done
  security:
    needs: changes
    uses: ./.github/workflows/security-checks.yml # zizmor: ignore[self-repository] -- compatible with pinned actionlint
    permissions:
      contents: read
      pull-requests: read
      security-events: write
  app:
    needs: changes
    uses: ./.github/workflows/app-checks.yml # zizmor: ignore[self-repository] -- compatible with pinned actionlint
  native:
    needs: changes
    if: needs.changes.outputs.native_platform != 'none'
    uses: ./.github/workflows/native-checks.yml # zizmor: ignore[self-repository] -- compatible with pinned actionlint
    with:
      platform: ${{ needs.changes.outputs.native_platform }}

  required:
    name: Required assurance
    if: always()
    needs: [changes, security, app, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce results
        env:
          RESULTS: ${{ toJSON(needs) }}
          NATIVE_PLATFORM: ${{ needs.changes.outputs.native_platform }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const mandatory = ['changes', 'security', 'app'];
          let failed = false;
          const rows = Object.entries(results).map(([name, job]) => {
            if (!(job.result === 'success' || (job.result === 'skipped' && !mandatory.includes(name)))) failed = true;
            return `| ${name} | ${job.result} |`;
          });
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `# ${process.env.REPOSITORY}\n\nCommit: ${process.env.REVISION}\n\nNative verification: ${process.env.NATIVE_PLATFORM || 'undetermined'}\n\n| Suite | Result |\n| --- | --- |\n${rows.join('\n')}\n\nNative jobs run selectively based on changed files. Security and app checks always run. Codex review is enforced separately by Review readiness.\n`);
          if (failed) process.exitCode = 1;
          NODE
