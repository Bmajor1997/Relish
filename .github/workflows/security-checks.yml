name: Meals and Mixers Code Quality & Security Checks

# Ported from Votic's security-checks.yml. Language-specific steps (npm, licenses,
# Trivy) switch on automatically once the files they scan exist.
# CodeQL and dependency review run on public repositories. Private repositories can opt in by
# setting ENABLE_GITHUB_CODE_SECURITY=true after confirming their GitHub plan and repository settings.
# Harden-Runner is currently skipped while this repository is private.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # Warns when a pull request introduces vulnerable or disallowed dependencies.
  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_GITHUB_CODE_SECURITY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Review dependency changes for vulnerabilities and licenses
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  # CodeQL searches the code for potential security flaws when GitHub Code Security is available.
  codeql:
    name: CodeQL Security Analysis
    if: ${{ !github.event.repository.private || vars.ENABLE_GITHUB_CODE_SECURITY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript, actions
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

  # Check the workflow files themselves for syntax and security mistakes.
  workflow-lint:
    name: Workflow Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell scripts with actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint -color
      - name: Audit workflows for security problems with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format plain .github/workflows

  # Scan dependencies, source code, repository history, and any infrastructure files.
  security:
    name: Security Scans and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a pull request's commits; private repos need this explicitly
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Security-tool regression tests run once in the backend suite.

      - name: Install app dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts
      - name: Check dependencies for vulnerabilities
        if: always() && hashFiles('package-lock.json') != ''
        run: |
          npm audit --json > npm-audit.json || true
          node security/update-vulnerability-report.cjs npm-audit.json
          node security/check-npm-audit.cjs npm-audit.json
      - name: Check dependency licenses
        if: always() && hashFiles('package-lock.json') != ''
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1 --production --summary
          --failOn "AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;SSPL-1.0"
      - name: Preserve dependency audit report
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-vulnerability-report
          retention-days: 90
          path: |
            npm-audit.json
            security/vulnerability-report.md

      # Pin the scanner image digest so the v2.6.0 tag cannot silently change its contents.
      - name: Scan dependencies with OSV-Scanner
        if: always() && hashFiles('**/package-lock.json', '**/requirements*.txt', '**/poetry.lock', '**/pubspec.lock', '**/Podfile.lock', '**/build.gradle*') != ''
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan --config=/src/osv-scanner.toml -r /src

      - name: Scan Dockerfiles and infrastructure config with Trivy
        # trivy-action is pinned by commit: its version tags were hijacked in March 2026 (CVE-2026-33634).
        if: always() && hashFiles('**/Dockerfile', '**/*.dockerfile', '**/docker-compose*.yml', '**/*.tf') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Scan source code with Semgrep
        if: always()
        # The official image bundles compatible Python dependencies; pin its content as well as its version.
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --config auto . --error

      - name: Scan repository for exposed secrets
        if: always()
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Require a complete nonempty secret scan
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-list --all --count)" -gt 0
          gitleaks_bin="$(node -p 'require("node:path").join(require("node:os").tmpdir(), "gitleaks-8.30.1", "gitleaks")')"
          test -x "$gitleaks_bin"
          "$gitleaks_bin" git --log-opts="--all" --redact --verbose --no-banner 2>&1 | tee gitleaks-scan.log
          node security/verify-gitleaks-log.cjs gitleaks-scan.log
