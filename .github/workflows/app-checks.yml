name: Meals and Mixers App and Server Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # Backend behavior, including identity, subscription, upload and AI-response edge cases.
  server:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm ci --ignore-scripts
      - name: Lint backend
        run: npm run lint
      # Includes security_edges.test.js: no real accounts, purchases, or paid AI calls are used.
      - name: Run backend and security tooling tests
        run: npm run test:coverage

  # Check generated recipes and publish possible allergen mismatches for human review.
  recipe-data:
    name: Recipe data and allergen review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check generated recipe data
        run: python3 scripts/check_recipe_consistency.py
      - name: Test recipe data checks
        run: python3 -m unittest discover -s code_checks -p 'recipe_ci_test.py'
      - name: Check food-safety advice and cooking times
        run: python3 scripts/check_recipe_quality.py
      - name: Check for the same photo on two dishes
        run: python3 scripts/check_photo_duplicates.py
      - name: Require reviewed allergen findings
        run: |
          python3 scripts/check_allergens.py > "$RUNNER_TEMP/recipe-allergen-review.md"
      - name: Publish allergen findings even when the check fails
        if: always()
        run: |
          cat "$RUNNER_TEMP/recipe-allergen-review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save allergen review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-allergen-review
          path: ${{ runner.temp }}/recipe-allergen-review.md
          retention-days: 30

  # Check app types, code style, diet and other logic, Android bundle, and dependencies.
  mobile:
    name: Mobile app checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      # Includes checks that AI recipe ingredients do not automatically inherit a diet label.
      - name: Run mobile behavior tests with coverage
        run: npm run test:coverage
      - name: Build the Android JavaScript bundle
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"
      - name: Audit production dependencies
        if: always()
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/mobile-audit.json" || true
          node ../../security/check-npm-audit.cjs "$RUNNER_TEMP/mobile-audit.json"
      - name: Check dependency licenses
        if: always()
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1 --production --summary
          --failOn "AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;SSPL-1.0"
      - name: Preserve mobile coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 30
