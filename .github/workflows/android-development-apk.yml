name: Android emulator development build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-development-apk.yml
      - apps/mobile/package.json
      - apps/mobile/package-lock.json
      - apps/mobile/app.config.*
      - apps/mobile/app.json
      - apps/mobile/plugins/**
      - security/install-android-ndk.sh
      - security/maven-central-mirror.init.gradle

permissions:
  contents: read

jobs:
  development-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      RECIPEAK_LOCAL_DEBUG_SIGNING: "1"
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install and validate Android NDK
        run: bash ../../security/install-android-ndk.sh
      - name: Configure Maven mirror
        run: install -Dm644 ../../security/maven-central-mirror.init.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/recipeak-maven-central.gradle"
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build emulator development APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
      - name: Upload emulator development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipeak-emulator-development-apk-NOT-FOR-PLAY
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
