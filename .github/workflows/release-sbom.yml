name: Meals and Mixers Release SBOM

# Attaches a software bill of materials (every package in the release) to each published GitHub release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate and attach SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the SBOM to the release
    steps:
      - name: Monitor runner network activity
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: meals-and-mixers.spdx.json
          artifact-name: meals-and-mixers.spdx.json
