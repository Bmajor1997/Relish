name: Google Play App Bundle (upload-signed, for internal testing)

# Builds the Android App Bundle (.aab) that Google Play needs, signed with Recipeak's private upload key, the same
# way as Votic. Run it by hand from the Actions tab. The upload key lives only in GitHub repository *secrets*
# (never in this file or the repo):
#   RECIPEAK_UPLOAD_KEYSTORE_BASE64  the .jks/.keystore file, base64-encoded
#   RECIPEAK_UPLOAD_STORE_PASSWORD   keystore password
#   RECIPEAK_UPLOAD_KEY_ALIAS        key alias (not androiddebugkey)
#   RECIPEAK_UPLOAD_KEY_PASSWORD     key password
# The EXPO_PUBLIC_* values are public build settings from the repository's Actions *variables*. The build stops
# early (security/check-mobile-release.cjs) if one is missing, or if the server address isn't public https.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode. Must be higher than any bundle already uploaded to Play (first upload: 1)."
        required: true
        default: "1"
      version_name:
        description: "Version shown to testers"
        required: true
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: android-play-aab
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      # Turns on the release settings check in app.config.js and the private-signing guard.
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: ${{ vars.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID || 'premium' }}
    steps:
      - name: Check the upload-key secrets are set
        working-directory: .
        env:
          KEYSTORE: ${{ secrets.RECIPEAK_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RECIPEAK_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECIPEAK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RECIPEAK_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing RECIPEAK_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RECIPEAK_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RECIPEAK_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RECIPEAK_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::version_code must be a whole number"; exit 1;; esac
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install and validate Android NDK
        run: bash ../../security/install-android-ndk.sh
      - name: Configure Maven Central mirror for Android builds
        run: install -Dm644 ../../security/maven-central-mirror.init.gradle "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/recipeak-maven-central.gradle"
      - name: Set this build's version
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION_NAME;
            app.expo.android = { ...app.expo.android, versionCode: Number(process.env.VERSION_CODE) };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            console.log("versionCode", app.expo.android.versionCode, "version", app.expo.version);
          '
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Restore the upload keystore
        env:
          KEYSTORE: ${{ secrets.RECIPEAK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/recipeak-upload.jks"
          test -s "$RUNNER_TEMP/recipeak-upload.jks"
      - name: Build the signed App Bundle (all phone architectures)
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2
        env:
          NODE_ENV: production
          RECIPEAK_UPLOAD_STORE_FILE: ${{ runner.temp }}/recipeak-upload.jks
          RECIPEAK_UPLOAD_STORE_PASSWORD: ${{ secrets.RECIPEAK_UPLOAD_STORE_PASSWORD }}
          RECIPEAK_UPLOAD_KEY_ALIAS: ${{ secrets.RECIPEAK_UPLOAD_KEY_ALIAS }}
          RECIPEAK_UPLOAD_KEY_PASSWORD: ${{ secrets.RECIPEAK_UPLOAD_KEY_PASSWORD }}
      - name: Show the upload certificate fingerprints (public)
        working-directory: apps/mobile/android
        run: keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA1|SHA256"
      - name: Remove the keystore from the runner
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/recipeak-upload.jks"
      - name: Upload the App Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipeak-play-aab-v${{ inputs.version_code }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
